$('uf').addEventListener('submit',async e=>{e.preventDefault();const m=$('msg');m.className='msg';m.textContent='Checking...';$('go').disabled=true;$('out').hidden=true;
 try{const fd=new FormData();fd.append('password',$('pw').value);fd.append('list','1');
  const r=await fetch(API+'/video-info',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));
  if(r.status===401){m.className='msg err';m.textContent='Wrong password.'}
  else if(!r.ok||!j.ok){m.textContent=j.error==='no video yet'?'Nothing is uploaded here yet.':'Something went wrong. Try again.'}
  else{m.textContent='';pwv=$('pw').value;show(j.items)}
 }catch(_){m.className='msg err';m.textContent='Could not reach the server. Check your connection.'}
 $('go').disabled=false});
async function dl(info,b,m){b.disabled=true;m.className='msg';const parts=[];
 try{for(let i=0;i<info.chunks;i++){m.textContent='Downloading part '+(i+1)+' of '+info.chunks+'...';
   const fd=new FormData();fd.append('password',pwv);fd.append('id',info.id);fd.append('i',i);
   const r=await fetch(API+'/video-part',{method:'POST',body:fd});if(!r.ok)throw 0;parts.push(await r.arrayBuffer())}
  const blob=new Blob(parts,{type:info.type||'video/mp4'});if(blob.size!==info.size)throw 0;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=info.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);m.textContent='Done. Check your downloads.'}
 catch(_){m.className='msg err';m.textContent='Download failed. Try again.'}
 b.disabled=false}
</script></body></html>
